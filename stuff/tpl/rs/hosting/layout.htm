<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<HTML>
<HEAD>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">
<TITLE>&#160;</TITLE>
<META HTTP-EQUIV="Content-Style-Type" CONTENT="text/css">
<STYLE type="text/css">
HTML, BODY {
  background-color: #FFFFFF;
  color: #333333;
  margin: 0;
  padding: 0;
  font-family: Georgia, sans-serif;
  font-size: 12px;
  font-weight: normal;
  height: 100%;
}
.layout {
  min-height:100%;
  position: relative;
}
* html .layout {height: 100%;}
.container {
  width: 90%;
  margin: auto;
  clear: both;
}
/* ********** ********** ********** HEADER AREA START ********** ********** ********** */
.hdr1-1 {
  background-color: #DDDDDD;
  float: left;
  width: 280px;
  height: 160px;
  margin: 0px;
  padding: 0px;
}
* html .hdr1-1 {margin-right: -3px;}
.hdr1-2 { /* OFFERS */
  background-color: #CCCCCC;
  height: 160px;
  margin-left: 280px;
  margin: 0px;
  padding: 0px 0px 0px 0px;
  overflow: hidden;
}
* html .hdr1-2 { margin-bottom: -3px;}
.hdr2-1 { /* LOGO1 */
  background-color: #CCCCCC;
  float: left;
  width: 280px;
  height: 29px;
  margin: 0px;
  padding: 0px;
}
* html .hdr2-1 {margin-right: -3px;}
.hdr2-2 { /* MENU 0 */
  background-color: #DDDDDD;
  height: 29px;
  margin-left: 280px;
  margin: 0px;
  padding: 0px 0px 0px 0px;
  overflow: hidden;
}
* html .hdr2-2 { margin-bottom: -3px;}
.hdr3-1 { /* LOGO2 */
  background-color: #DDDDDD;
  float: left;
  width: 280px;
  height: 35px;
  margin: 0px;
  padding: 0px;
}
* html .hdr3-1 {margin-right: -3px;}
.hdr3-2 { /* MENU 2 */
  background-color: #CCCCCC;
  height: 35px;
  margin-left: 280px;
  margin: 0px;
  padding: 0px 0px 0px 0px;
  overflow: hidden;
}
* html .hdr3-2 { margin-bottom: -3px;}
/* ********** ********** ********** HEADER AREA END ********** ********** ********** */
/* ********** ********** ********** CONTENT AREA START ********** ********** ********** */
.cleft {
  background-color: #CCCCCC;
  float: left;
  width: 210px;
  min-height: 300px;
  padding: 0px 0px 0px 0px;
  overflow: auto;
}
* html .cleft {margin-right: -3px; height: 300px;}
.cright {
  background-color: #CCCCCC;
  float: right;
  width: 210px;
  min-height: 300px;
  padding: 0px 0px 0px 0px;
  overflow: auto;
}
* html .cright {margin-left: -3px; height: 300px;}
.ccont {
  background-color: #DDDDDD;
  min-height: 300px;
  margin-left: 210px;
  margin-right: 210px; 
}
* html .ccont {margin-left: 207px; margin-right: 207px; height: 300px;}
.clear {
    clear:both;
    height:1px;
    overflow:hidden;
}
/* ********** ********** ********** CONTENT AREA END ********** ********** ********** */
/* ********** ********** ********** FOOTER AREA START ********** ********** ********** */
.ftr {
  background-color: #CCCCCC;
  width: 100%;
  height: 40px;
  padding: 0px 0px 0px 0px;
  text-align: center;
  position: absolute;
  bottom: 0;
}
.footer {
  background-color: #DDDDDD;
  width: 770px;
  height: 20px;
  padding: 10px 0px 10px 0px;
  font-size: 0.9em;
  text-align: center;
  margin: auto;
}
/* ********** ********** ********** FOOTER AREA END ********** ********** ********** */
</STYLE>
</HEAD>
<BODY>
<DIV CLASS="layout">
  <DIV CLASS="container">
    <DIV CLASS="hdr1-1">
      &#160;
    </DIV>
    <DIV CLASS="hdr1-2">
      &#160;
    </DIV>
  </DIV>
  
  <DIV CLASS="container">
    <DIV CLASS="hdr2-1">
      &#160;
    </DIV>
    <DIV CLASS="hdr2-2">
      &#160;
    </DIV>
  </DIV>
  
  <DIV CLASS="container">
    <DIV CLASS="hdr3-1">
      &#160;
    </DIV>
    <DIV CLASS="hdr3-2">
      &#160;
    </DIV>
  </DIV>
  
  <DIV CLASS="container" STYLE="padding-bottom: 40px;">
    <DIV CLASS="cleft">
      left side content
    </DIV>
    <DIV CLASS="cright">
      right side content
    </DIV>
    <DIV CLASS="ccont">
    main content
    </DIV>
    <DIV CLASS="clear">
    </DIV>
  </DIV>
  
  <DIV CLASS="ftr">
    <DIV CLASS="footer">
    Copyright.&#160;
    </DIV>
  </DIV>
</DIV>


</BODY>
</HTML>
