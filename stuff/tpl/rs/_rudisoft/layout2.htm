<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<HTML>
<HEAD>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">
<TITLE>&#160;</TITLE>
<META HTTP-EQUIV="Content-Style-Type" CONTENT="text/css">
<STYLE type="text/css">
HTML, BODY {
  background-color: #000000;
  color: #EEEEEE;
  margin: 0;
  padding: 0;
  font-family: Georgia, sans-serif;
  font-size: 12px;
  height: 100%;
}
.layout {
  min-height:100%;
  position:relative;
}
* html .layout {height: 100%;}
.container {
  clear: both;
  width: 90%;
  margin: auto;
  display: table;
}
/* ********** ********** ********** HEADER AREA START ********** ********** ********** */
.logo {
  float: left;
  width: 250px;
  height: 80px;
  margin: 0px;
}
* html .logo { margin-right: -3px;}
.hdr {
  height: 80px;
  overflow: auto;
  padding: 0px 0px 0px 0px;
}
* html .hdr { margin-bottom: -2px;}
/* ********** ********** ********** HEADER AREA END ********** ********** ********** */
/* ********** ********** ********** CONTENT AREA START ********** ********** ********** */
.cleft {
  float: left;
  width: 210px;
  border-top: 2px solid #CC0000;
  padding: 5px 5px 5px 5px;
  overflow: auto;
}
.cright {
  float: right;
  width: 210px;
  border-top: 2px solid #CC0000;
  padding: 5px 5px 5px 5px;
  overflow: auto;
}
.ccont {
  margin-left: 220px; 
  margin-right: 220px; 
  border-left: 2px solid #CC0000;
  border-right: 2px solid #CC0000;
}
.cnt {
  margin-left: 10px; 
  margin-right: 10px;
  padding: 10px 10px 10px 10px;
  min-height: 400px;
  overflow: auto;
  border-left: 2px solid #CC0000;
  border-right: 2px solid #CC0000;
}
* html .cnt {height: 400px; margin-left: 7px; margin-right: 7px;}
.cnt_top {
    width: 50%;
    height: 2px;
    margin-left: 10px;
    background-color: #CC0000;
}
* html .cnt_top {display: block; margin-left: 7px;}
.cnt_bottom {
    width: 50%;
    height: 2px;
    margin-right: 10px;
    background-color: #CC0000;
}
* html .cnt_bottom {display: block;}
/* ********** ********** ********** CONTENT AREA END ********** ********** ********** */
/* ********** ********** ********** FOOTER AREA START ********** ********** ********** */
.footer {
  width: 100%;
  height: 20px;
  padding: 10px 0px 10px 0px;
  font-size: 0.9em;
  text-align: center;
  position: absolute;
  bottom: 0;
}
/* ********** ********** ********** FOOTER AREA END ********** ********** ********** */
</STYLE>
</HEAD>
<BODY>

<DIV CLASS="layout">
  <DIV CLASS="container">
    <DIV CLASS="logo">
      <IMG SRC="logo2.gif" ALT="">
    </DIV>
    <DIV CLASS="hdr">
      header
    </DIV>
  </DIV>
  
  <DIV CLASS="container" STYLE="padding-bottom: 40px;">
    <DIV CLASS="cleft">
      left side content
    </DIV>
    <DIV CLASS="cright">
      right side content
      <DIV STYLE="
      border: 1px solid #CC0000;
      padding: 5px 5px 5px 5px;
      margin-top: 5px;
      
      ">
      module<BR>
      module<BR>
      module<BR>
      module<BR>
      </DIV>
    </DIV>
    <DIV CLASS="ccont">
      <DIV ALIGN="left"><IMG CLASS="cnt_top" SRC="dot2.png"  ALT=""></DIV>
      <DIV CLASS="cnt">
        main content
      </DIV>
      <DIV ALIGN="right"><IMG CLASS="cnt_bottom" SRC="dot2.png" ALT=""></DIV>
    </DIV>
  </DIV>

  <DIV CLASS="footer">
     footer Copyright.. Link. Text etc etc
  </DIV>
</DIV>
</BODY>
</HTML>
